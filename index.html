<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Fácil — MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e7eaf0;padding:22px 14px}.logo{font-weight:800;font-size:22px;margin:0 10px 28px}.logo span{color:#4f46e5}.nav button{width:100%;border:0;background:none;padding:12px 14px;text-align:left;border-radius:10px;margin:3px 0;cursor:pointer;font-size:14px;color:#4b5563}.nav button.active,.nav button:hover{background:#eef2ff;color:#4338ca;font-weight:600}
.main{flex:1;padding:26px;max-width:1300px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.btn{border:0;background:#4f46e5;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:650}.btn.secondary{background:#fff;color:#374151;border:1px solid #ddd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e8ebf1;border-radius:14px;padding:18px}.muted{color:#6b7280;font-size:13px}.num{font-size:27px;font-weight:800;margin-top:7px}.panel{background:#fff;border:1px solid #e8ebf1;border-radius:14px;padding:18px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 14px}.tasks{display:grid;gap:10px}.task{display:flex;justify-content:space-between;align-items:center;border:1px solid #edf0f4;border-radius:10px;padding:12px}.badge{font-size:12px;padding:5px 8px;border-radius:99px;background:#eef2ff;color:#4338ca}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:14px}.table th{font-size:12px;color:#6b7280;text-transform:uppercase}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow:auto}.stage{background:#f7f8fb;border-radius:12px;padding:10px;min-height:220px}.stage h3{font-size:13px;margin:4px 5px 10px}.deal{background:#fff;border:1px solid #e7eaf0;border-radius:10px;padding:11px;margin:8px 0;box-shadow:0 1px 2px #00000008}.deal strong{display:block;font-size:14px}.deal small{color:#6b7280}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;width:min(520px,100%);padding:22px}.box h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe3ea;border-radius:9px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:850px){.side{width:70px;padding:12px 7px}.logo{font-size:0}.logo span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.cards{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(5,190px)}}@media(max-width:520px){.main{padding:16px}.cards{grid-template-columns:1fr 1fr}.top h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">CRM <span>Fácil</span></div>
  <div class="nav">
    <button class="active" onclick="show('inicio',this)">🏠 Início</button>
    <button onclick="show('clientes',this)">👥 Clientes</button>
    <button onclick="show('negocios',this)">💼 Negócios</button>
    <button onclick="show('tarefas',this)">✅ Tarefas</button>
  </div>
</aside>
<main class="main" id="content"></main>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h2 id="modalTitle">Novo cliente</h2>
  <form id="form">
   <div class="field"><label>Nome</label><input id="nome" required></div>
   <div class="field"><label>Empresa</label><input id="empresa"></div>
   <div class="field"><label>WhatsApp</label><input id="whats"></div>
   <div class="field"><label>E-mail</label><input id="email" type="email"></div>
   <div class="field"><label>Observação</label><textarea id="obs" rows="3"></textarea></div>
   <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div>
  </form>
 </div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('crmfacil')||'null')||{
 clientes:[
  {nome:'João Silva',empresa:'JS Construções',whats:'(15) 99999-0000',email:'joao@email.com',obs:'Pediu orçamento.'},
  {nome:'Maria Oliveira',empresa:'MO Arquitetura',whats:'(15) 98888-1111',email:'maria@email.com',obs:'Retornar sexta-feira.'}
 ],
 negocios:[
  {nome:'João Silva',servico:'Pintura residencial',valor:4500,etapa:'Orçamento'},
  {nome:'Maria Oliveira',servico:'Projeto comercial',valor:8200,etapa:'Negociação'},
  {nome:'Carlos Souza',servico:'Instalação',valor:2300,etapa:'Novo contato'},
  {nome:'Empresa Alfa',servico:'Serviço recorrente',valor:12000,etapa:'Fechado'}
 ],
 tarefas:[
  {titulo:'Fazer follow-up com João Silva',data:'Hoje'},
  {titulo:'Enviar proposta para Maria Oliveira',data:'Hoje'},
  {titulo:'Ligar para Empresa Alfa',data:'Amanhã'}
 ]};

function save(){localStorage.setItem('crmfacil',JSON.stringify(data))}
function money(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function renderInicio(){
 const pipeline=data.negocios.filter(x=>x.etapa!=='Fechado'&&x.etapa!=='Perdido').reduce((a,b)=>a+b.valor,0);
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Bom dia! 👋</h1><div class="muted">Seu comercial de forma simples.</div></div><button class="btn" onclick="openModal()">＋ Novo cliente</button></div>
 <div class="cards">
  <div class="card"><div class="muted">Clientes</div><div class="num">${data.clientes.length}</div></div>
  <div class="card"><div class="muted">Em negociação</div><div class="num">${data.negocios.filter(x=>x.etapa==='Negociação').length}</div></div>
  <div class="card"><div class="muted">Pipeline</div><div class="num">${money(pipeline)}</div></div>
  <div class="card"><div class="muted">Tarefas hoje</div><div class="num">${data.tarefas.filter(x=>x.data==='Hoje').length}</div></div>
 </div>
 <div class="panel"><h2>Próximas ações</h2><div class="tasks">${data.tarefas.slice(0,6).map((t,i)=>`<div class="task"><span>🔔 ${t.titulo}</span><span class="badge">${t.data}</span></div>`).join('')}</div></div>
 <div class="panel"><h2>Negócios recentes</h2><table class="table"><tr><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Etapa</th></tr>${data.negocios.slice(0,6).map(n=>`<tr><td>${n.nome}</td><td>${n.servico}</td><td>${money(n.valor)}</td><td><span class="badge">${n.etapa}</span></td></tr>`).join('')}</table></div>`;
}
function renderClientes(){
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Clientes</h1><div class="muted">Seus contatos em um só lugar.</div></div><button class="btn" onclick="openModal()">＋ Novo cliente</button></div>
 <div class="panel"><table class="table"><tr><th>Nome</th><th>Empresa</th><th>WhatsApp</th><th>E-mail</th></tr>${data.clientes.map(c=>`<tr><td><strong>${c.nome}</strong></td><td>${c.empresa||'-'}</td><td>${c.whats||'-'}</td><td>${c.email||'-'}</td></tr>`).join('')}</table></div>`;
}
function renderNegocios(){
 const stages=['Novo contato','Em atendimento','Orçamento','Negociação','Fechado'];
 document.getElementById('content').innerHTML=`<div class="top"><div><h1>Negócios</h1><div class="muted">Acompanhe cada oportunidade até o fechamento.</div></div></div>
 <div class="pipeline">${stages.map(s=>`<div class="stage"><h3>${s}</h3>${data.negocios.filter(n=>n.etapa===s).map(n=>`<div class="deal"><strong>${n.nome}</strong><small>${n.servico}</small><br><b>${money(n.valor)}</b></div>`).join('')}</div>`).join('')}</div>`;
}
function renderTarefas(){
 document.getElementById('content').innerHTML=`<div class="top"><div><h1>Tarefas</h1><div class="muted">O que precisa ser feito para não perder oportunidades.</div></div></div>
 <div class="panel"><div class="tasks">${data.tarefas.map(t=>`<div class="task"><span>✅ ${t.titulo}</span><span class="badge">${t.data}</span></div>`).join('')}</div></div>`;
}
function show(page,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');({inicio:renderInicio,clientes:renderClientes,negocios:renderNegocios,tarefas:renderTarefas}[page])()}
function openModal(){document.getElementById('form').reset();document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();data.clientes.push({nome:nome.value,empresa:empresa.value,whats:whats.value,email:email.value,obs:obs.value});save();closeModal();renderClientes()})
renderInicio();
</script>
</body>
</html>
