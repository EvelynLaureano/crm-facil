<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Fácil — MVP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e7eaf0;padding:22px 14px}.logo{font-weight:800;font-size:22px;margin:0 10px 28px}.logo span{color:#4f46e5}.nav button{width:100%;border:0;background:none;padding:12px 14px;text-align:left;border-radius:10px;margin:3px 0;cursor:pointer;font-size:14px;color:#4b5563}.nav button.active,.nav button:hover{background:#eef2ff;color:#4338ca;font-weight:600}
.main{flex:1;padding:26px;max-width:1300px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.btn{border:0;background:#4f46e5;color:#fff;padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:650}.btn.secondary{background:#fff;color:#374151;border:1px solid #ddd}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e8ebf1;border-radius:14px;padding:18px}.muted{color:#6b7280;font-size:13px}.num{font-size:27px;font-weight:800;margin-top:7px}.panel{background:#fff;border:1px solid #e8ebf1;border-radius:14px;padding:18px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 14px}.tasks{display:grid;gap:10px}.task{display:flex;justify-content:space-between;align-items:center;border:1px solid #edf0f4;border-radius:10px;padding:12px}.badge{font-size:12px;padding:5px 8px;border-radius:99px;background:#eef2ff;color:#4338ca}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4;font-size:14px}.table th{font-size:12px;color:#6b7280;text-transform:uppercase}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow:auto}.stage{background:#f7f8fb;border-radius:12px;padding:10px;min-height:220px}.stage h3{font-size:13px;margin:4px 5px 10px}.deal{background:#fff;border:1px solid #e7eaf0;border-radius:10px;padding:11px;margin:8px 0;box-shadow:0 1px 2px #00000008}.deal strong{display:block;font-size:14px}.deal small{color:#6b7280}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:16px;width:min(520px,100%);padding:22px}.box h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dfe3ea;border-radius:9px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:850px){.side{width:70px;padding:12px 7px}.logo{font-size:0}.logo span{font-size:22px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.cards{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:repeat(5,190px)}}@media(max-width:520px){.main{padding:16px}.cards{grid-template-columns:1fr 1fr}.top h1{font-size:21px}.table{display:block;overflow-x:auto}.actions{flex-wrap:wrap}.task{align-items:flex-start;gap:10px;flex-wrap:wrap}.task>span:last-child{display:flex;flex-wrap:wrap;gap:5px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">CRM <span>Fácil</span></div>
  <div class="nav">
    <button class="active" onclick="show('inicio',this)">🏠 Início</button>
    <button onclick="show('clientes',this)">👥 Clientes</button>
    <button onclick="show('negocios',this)">💼 Negócios</button>
    <button onclick="show('tarefas',this)">✅ Tarefas</button>
  </div>
</aside>
<main class="main" id="content"></main>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h2 id="modalTitle">Novo cliente</h2>
  <form id="form">
   <div class="field"><label>Nome</label><input id="nome" required></div>
   <div class="field"><label>Empresa</label><input id="empresa"></div>
   <div class="field"><label>WhatsApp</label><input id="whats"></div>
   <div class="field"><label>E-mail</label><input id="email" type="email"></div>
   <div class="field"><label>Observação</label><textarea id="obs" rows="3"></textarea></div>
   <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div>
  </form>
 </div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('crmfacil')||'null')||{
 clientes:[
  {nome:'João Silva',empresa:'JS Construções',whats:'(15) 99999-0000',email:'joao@email.com',obs:'Pediu orçamento.'},
  {nome:'Maria Oliveira',empresa:'MO Arquitetura',whats:'(15) 98888-1111',email:'maria@email.com',obs:'Retornar sexta-feira.'}
 ],
 negocios:[
  {nome:'João Silva',servico:'Pintura residencial',valor:4500,desconto:0,pago:0,vencimento:'',etapa:'Orçamento'},
  {nome:'Maria Oliveira',servico:'Projeto comercial',valor:8200,desconto:500,pago:2000,vencimento:'2026-09-15',etapa:'Negociação'},
  {nome:'Carlos Souza',servico:'Instalação',valor:2300,desconto:0,pago:0,vencimento:'',etapa:'Novo contato'},
  {nome:'Empresa Alfa',servico:'Serviço recorrente',valor:12000,desconto:1000,pago:12000,vencimento:'',etapa:'Fechado'}
 ],
 tarefas:[
  {titulo:'Fazer follow-up com João Silva',data:'Hoje',cliente:'João Silva',status:'Pendente'},
  {titulo:'Enviar proposta para Maria Oliveira',data:'Hoje',cliente:'Maria Oliveira',status:'Pendente'},
  {titulo:'Ligar para Empresa Alfa',data:'Amanhã',cliente:'Empresa Alfa',status:'Pendente'}
 ]};

function save(){localStorage.setItem('crmfacil',JSON.stringify(data))}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function num(v){return Number(String(v||0).replace(/\./g,'').replace(',','.'))||0}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function totalNegocio(n){return Math.max(0,Number(n.valor||0)-Number(n.desconto||0))}
function restante(n){return Math.max(0,totalNegocio(n)-Number(n.pago||0))}
function paymentLabel(n){
 const total=totalNegocio(n), pago=Number(n.pago||0);
 if(total<=0) return 'Sem valor';
 if(pago>=total) return 'Pago';
 if(pago>0) return 'Parcial';
 return 'Pendente';
}

function renderInicio(){
 const pipeline=data.negocios.filter(x=>!['Fechado','Perdido'].includes(x.etapa)).reduce((a,b)=>a+restante(b),0);
 const pend=data.tarefas.filter(t=>t.status!=='Concluída' && (t.data==='Hoje'||t.data==='Atrasada')).length;
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Bom dia! 👋</h1><div class="muted">Seu comercial de forma simples.</div></div><button class="btn" onclick="openClienteModal()">＋ Novo cliente</button></div>
 <div class="cards">
  <div class="card"><div class="muted">Clientes</div><div class="num">${data.clientes.length}</div></div>
  <div class="card"><div class="muted">Em negociação</div><div class="num">${data.negocios.filter(x=>x.etapa==='Negociação').length}</div></div>
  <div class="card"><div class="muted">A receber no pipeline</div><div class="num">${money(pipeline)}</div></div>
  <div class="card"><div class="muted">Tarefas pendentes</div><div class="num">${pend}</div></div>
 </div>
 <div class="panel"><h2>Próximas ações</h2><div class="tasks">${data.tarefas.filter(t=>t.status!=='Concluída').slice(0,6).map((t,i)=>`<div class="task"><span>🔔 ${esc(t.titulo)}</span><span class="badge">${esc(t.data)}</span></div>`).join('')||'<div class="muted">Nenhuma tarefa pendente.</div>'}</div></div>
 <div class="panel"><h2>Negócios recentes</h2><table class="table"><tr><th>Cliente</th><th>Serviço</th><th>Total</th><th>Etapa</th><th>Recebimento</th></tr>${data.negocios.slice(0,6).map(n=>`<tr><td>${esc(n.nome)}</td><td>${esc(n.servico)}</td><td>${money(totalNegocio(n))}</td><td><span class="badge">${esc(n.etapa)}</span></td><td>${money(restante(n))} restante</td></tr>`).join('')}</table></div>`;
}

function renderClientes(){
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Clientes</h1><div class="muted">Seus contatos em um só lugar.</div></div><button class="btn" onclick="openClienteModal()">＋ Novo cliente</button></div>
 <div class="panel"><table class="table"><tr><th>Nome</th><th>Empresa</th><th>WhatsApp</th><th>E-mail</th><th>Ações</th></tr>${data.clientes.map((c,i)=>`<tr><td><strong>${esc(c.nome)}</strong></td><td>${esc(c.empresa)||'-'}</td><td>${esc(c.whats)||'-'}</td><td>${esc(c.email)||'-'}</td><td><button class="btn secondary" onclick="openClienteModal(${i})">✏️ Editar</button> <button class="btn secondary" onclick="deleteCliente(${i})">🗑️ Excluir</button></td></tr>`).join('')}</table></div>`;
}
function openClienteModal(i=null){
 const c=i===null?{nome:'',empresa:'',whats:'',email:'',obs:''}:data.clientes[i];
 showModal(`
 <h2>${i===null?'Novo cliente':'Editar cliente'}</h2>
 <form onsubmit="saveCliente(event,${i===null?'null':i})">
  ${field('Nome','c_nome',c.nome,true)}${field('Empresa','c_empresa',c.empresa)}${field('WhatsApp','c_whats',c.whats)}${field('E-mail','c_email',c.email,'','email')}${field('Observação','c_obs',c.obs,'','textarea')}
  <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div>
 </form>`);
}
function saveCliente(e,i){e.preventDefault();const c={nome:c_nome.value,empresa:c_empresa.value,whats:c_whats.value,email:c_email.value,obs:c_obs.value};if(i===null)data.clientes.push(c);else data.clientes[i]=c;save();closeModal();renderClientes()}
function deleteCliente(i){if(confirm('Excluir este cliente?')){data.clientes.splice(i,1);save();renderClientes()}}

const stages=['Novo contato','Em atendimento','Orçamento','Negociação','Fechado','Perdido'];
function renderNegocios(){
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Negócios</h1><div class="muted">Mova o lead pelo funil e controle proposta, desconto e pagamentos.</div></div><button class="btn" onclick="openNegocioModal()">＋ Novo negócio</button></div>
 <div class="pipeline">${stages.map(s=>`<div class="stage"><h3>${s}</h3>${data.negocios.filter(n=>n.etapa===s).map((n,i)=>{const idx=data.negocios.indexOf(n);return `<div class="deal"><strong>${esc(n.nome)}</strong><small>${esc(n.servico)}</small><br><b>${money(totalNegocio(n))}</b><div class="muted">Pago: ${money(n.pago)} · Falta: ${money(restante(n))}</div><div class="badge">${paymentLabel(n)}</div><div style="margin-top:8px"><select onchange="moveNegocio(${idx},this.value)" style="width:100%;padding:7px;border:1px solid #dfe3ea;border-radius:8px">${stages.map(x=>`<option ${x===n.etapa?'selected':''}>${x}</option>`).join('')}</select></div><div style="margin-top:7px"><button class="btn secondary" onclick="openNegocioModal(${idx})">✏️ Editar</button> <button class="btn secondary" onclick="deleteNegocio(${idx})">🗑️</button></div></div>`}).join('')||'<div class="muted">Nenhum negócio.</div>'}</div>`).join('')}</div>
 <div class="panel"><h2>Resumo financeiro</h2><div class="cards">
 <div class="card"><div class="muted">Valor bruto</div><div class="num">${money(data.negocios.reduce((a,n)=>a+Number(n.valor||0),0))}</div></div>
 <div class="card"><div class="muted">Descontos</div><div class="num">${money(data.negocios.reduce((a,n)=>a+Number(n.desconto||0),0))}</div></div>
 <div class="card"><div class="muted">Recebido</div><div class="num">${money(data.negocios.reduce((a,n)=>a+Number(n.pago||0),0))}</div></div>
 <div class="card"><div class="muted">A receber</div><div class="num">${money(data.negocios.reduce((a,n)=>a+restante(n),0))}</div></div>
 </div></div>`;
}
function openNegocioModal(i=null){
 const n=i===null?{nome:'',servico:'',valor:'',desconto:0,pago:0,vencimento:'',etapa:'Novo contato'}:data.negocios[i];
 const clientOpts=data.clientes.map(c=>`<option ${c.nome===n.nome?'selected':''}>${esc(c.nome)}</option>`).join('');
 showModal(`
 <h2>${i===null?'Novo negócio':'Editar negócio'}</h2>
 <form onsubmit="saveNegocio(event,${i===null?'null':i})">
  <div class="field"><label>Cliente</label><select id="n_nome" required><option value="">Selecione</option>${clientOpts}</select></div>
  ${field('Serviço / proposta','n_servico',n.servico,true)}
  ${field('Valor da proposta','n_valor',n.valor,'number')}
  ${field('Desconto','n_desconto',n.desconto,'number')}
  ${field('Valor já pago','n_pago',n.pago,'number')}
  ${field('Data de vencimento / próxima parcela','n_vencimento',n.vencimento,'date')}
  <div class="field"><label>Etapa do funil</label><select id="n_etapa">${stages.map(s=>`<option ${s===n.etapa?'selected':''}>${s}</option>`).join('')}</select></div>
  <div class="muted">Total após desconto e valor restante serão calculados automaticamente.</div>
  <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar negócio</button></div>
 </form>`);
}
function saveNegocio(e,i){e.preventDefault();const n={nome:n_nome.value,servico:n_servico.value,valor:num(n_valor.value),desconto:num(n_desconto.value),pago:num(n_pago.value),vencimento:n_vencimento.value,etapa:n_etapa.value};if(n.desconto>n.valor)n.desconto=n.valor;if(n.pago>n.valor-n.desconto)n.pago=n.valor-n.desconto;if(i===null)data.negocios.push(n);else data.negocios[i]=n;save();closeModal();renderNegocios()}
function moveNegocio(i,stage){data.negocios[i].etapa=stage;save();renderNegocios()}
function deleteNegocio(i){if(confirm('Excluir este negócio?')){data.negocios.splice(i,1);save();renderNegocios()}}

function renderTarefas(){
 document.getElementById('content').innerHTML=`
 <div class="top"><div><h1>Tarefas</h1><div class="muted">Crie, edite e conclua atividades para não perder oportunidades.</div></div><button class="btn" onclick="openTarefaModal()">＋ Nova tarefa</button></div>
 <div class="panel"><div class="tasks">${data.tarefas.map((t,i)=>`<div class="task"><span>${t.status==='Concluída'?'☑️':'⬜'} <strong>${esc(t.titulo)}</strong><br><small class="muted">${esc(t.cliente||'Sem cliente')} · ${esc(t.data)}</small></span><span><span class="badge">${esc(t.status||'Pendente')}</span> <button class="btn secondary" onclick="toggleTarefa(${i})">${t.status==='Concluída'?'↩️ Reabrir':'✓ Concluir'}</button> <button class="btn secondary" onclick="openTarefaModal(${i})">✏️ Editar</button> <button class="btn secondary" onclick="deleteTarefa(${i})">🗑️</button></span></div>`).join('')||'<div class="muted">Nenhuma tarefa cadastrada.</div>'}</div></div>`;
}
function openTarefaModal(i=null){
 const t=i===null?{titulo:'',data:'Hoje',cliente:'',status:'Pendente'}:data.tarefas[i];
 showModal(`
 <h2>${i===null?'Nova tarefa':'Editar tarefa'}</h2>
 <form onsubmit="saveTarefa(event,${i===null?'null':i})">
  ${field('Tarefa','t_titulo',t.titulo,true)}
  <div class="field"><label>Cliente</label><select id="t_cliente"><option value="">Sem cliente</option>${data.clientes.map(c=>`<option ${c.nome===t.cliente?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
  <div class="field"><label>Quando</label><select id="t_data"><option ${t.data==='Hoje'?'selected':''}>Hoje</option><option ${t.data==='Amanhã'?'selected':''}>Amanhã</option><option ${t.data==='Esta semana'?'selected':''}>Esta semana</option><option ${t.data==='Atrasada'?'selected':''}>Atrasada</option></select></div>
  <div class="field"><label>Status</label><select id="t_status"><option ${t.status!=='Concluída'?'selected':''}>Pendente</option><option ${t.status==='Concluída'?'selected':''}>Concluída</option></select></div>
  <div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar tarefa</button></div>
 </form>`);
}
function saveTarefa(e,i){e.preventDefault();const t={titulo:t_titulo.value,cliente:t_cliente.value,data:t_data.value,status:t_status.value};if(i===null)data.tarefas.push(t);else data.tarefas[i]=t;save();closeModal();renderTarefas()}
function toggleTarefa(i){data.tarefas[i].status=data.tarefas[i].status==='Concluída'?'Pendente':'Concluída';save();renderTarefas()}
function deleteTarefa(i){if(confirm('Excluir esta tarefa?')){data.tarefas.splice(i,1);save();renderTarefas()}}

function field(label,id,value,required=false,type='text'){
 if(type==='textarea') return `<div class="field"><label>${label}</label><textarea id="${id}" rows="3">${esc(value||'')}</textarea></div>`;
 const req=required===true?'required':''; const tp=typeof required==='string'?required:type;
 return `<div class="field"><label>${label}</label><input id="${id}" type="${tp}" value="${esc(value??'')}" ${req} min="0" step="0.01"></div>`;
}
function showModal(content){document.getElementById('modal').querySelector('.box').innerHTML=content;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function show(page,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');({inicio:renderInicio,clientes:renderClientes,negocios:renderNegocios,tarefas:renderTarefas}[page])()}
renderInicio();
</script>
</body>
</html>
